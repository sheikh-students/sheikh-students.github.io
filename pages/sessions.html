<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الجلسات - دفتر المتابعة اليومية</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-nav="sessions">
    <header class="site-header" id="site-header"></header>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <main>
        <section class="panel">
            <h2>إنشاء جلسة</h2>
            <form id="session-form" class="form-row">
                <div class="field field-grow">
                    <label for="session-title">العنوان (اختياري)</label>
                    <input type="text" id="session-title" maxlength="150" autocomplete="off">
                </div>
                <div class="field">
                    <label for="session-date">من تاريخ (بداية الأسبوع)</label>
                    <input type="date" id="session-date" required>
                </div>
                <div class="field">
                    <label for="session-end-date">إلى تاريخ (اختياري)</label>
                    <input type="date" id="session-end-date">
                </div>
                <button type="submit" class="button">إنشاء الجلسة</button>
            </form>
        </section>

        <section class="panel">
            <h2>الجلسات</h2>
            <ul class="row-list" id="sessions-list"></ul>
        </section>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sessions.js"></script>
</body>
</html>
