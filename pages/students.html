<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الطلاب - دفتر المتابعة اليومية</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-nav="students">
    <header class="site-header" id="site-header"></header>
    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <main>
        <section class="panel">
            <h2>إضافة طالب</h2>
            <form id="student-form" class="form-row">
                <div class="field field-grow">
                    <label for="student-name">اسم الطالب</label>
                    <input type="text" id="student-name" maxlength="100" required autocomplete="off">
                </div>
                <button type="submit" class="button">إضافة</button>
            </form>
        </section>

        <section class="panel">
            <h2>قائمة الطلاب</h2>
            <div class="form-row filters">
                <div class="field field-grow">
                    <label for="search-input">بحث بالاسم</label>
                    <input type="search" id="search-input" autocomplete="off">
                </div>
                <div class="field">
                    <label for="active-filter">الحالة</label>
                    <select id="active-filter">
                        <option value="">الكل</option>
                        <option value="true">النشطون</option>
                        <option value="false">المعطلون</option>
                    </select>
                </div>
            </div>
            <ul class="row-list" id="students-list"></ul>
        </section>
    </main>

    <dialog id="edit-dialog" aria-labelledby="edit-title">
        <form id="edit-form">
            <h2 id="edit-title">تعديل اسم الطالب</h2>
            <div class="field">
                <label for="edit-name">الاسم</label>
                <input type="text" id="edit-name" maxlength="100" required autocomplete="off">
            </div>
            <div class="dialog-actions">
                <button type="submit" class="button">حفظ</button>
                <button type="button" class="button button-secondary" id="edit-cancel">إلغاء</button>
            </div>
        </form>
    </dialog>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/students.js"></script>
</body>
</html>
